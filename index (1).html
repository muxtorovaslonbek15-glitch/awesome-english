<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awesome English</title>
<meta name="description" content="A curated collection of high-quality resources for learning English.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css">
<style>
  body { margin: 0; background: #ffffff; }
  .markdown-body {
    box-sizing: border-box;
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }
  #loading {
    max-width: 900px;
    margin: 64px auto;
    padding: 0 24px;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #57606a;
  }
  @media (max-width: 767px) {
    .markdown-body { padding: 16px; }
  }
</style>
</head>
<body>
<div id="loading">Loading…</div>
<article id="content" class="markdown-body" style="display:none;"></article>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
function slugify(text) {
  return text
    .toLowerCase()
    .replace(/[^\w\- ]/g, '')
    .trim()
    .replace(/ /g, '-');
}

function addHeadingIds(root) {
  var counts = {};
  var headings = root.querySelectorAll('h1, h2, h3, h4, h5, h6');
  headings.forEach(function (h) {
    var slug = slugify(h.textContent);
    if (counts[slug] === undefined) {
      counts[slug] = 0;
    } else {
      counts[slug]++;
      slug = slug + '-' + counts[slug];
    }
    h.id = slug;
  });
}

function scrollToHash() {
  if (!location.hash) return;
  var id = decodeURIComponent(location.hash.slice(1));
  var el = document.getElementById(id);
  if (el) el.scrollIntoView();
}

(function () {
  fetch('readme.md')
    .then(function (res) {
      if (!res.ok) throw new Error('Failed to load readme.md (' + res.status + ')');
      return res.text();
    })
    .then(function (markdown) {
      var contentEl = document.getElementById('content');
      contentEl.innerHTML = marked.parse(markdown);
      document.getElementById('loading').style.display = 'none';
      contentEl.style.display = 'block';

      // marked v12 no longer adds ids to headings by default,
      // so in-page anchor links (e.g. #grammar) had nothing to jump to.
      addHeadingIds(contentEl);
      scrollToHash();

      // Handle clicks on in-page anchor links after the initial load too
      // (covers cases where the browser tried to scroll before content existed).
      window.addEventListener('hashchange', scrollToHash);
    })
    .catch(function (err) {
      document.getElementById('loading').textContent =
        'Could not load content: ' + err.message;
    });
})();
</script>
</body>
</html>
